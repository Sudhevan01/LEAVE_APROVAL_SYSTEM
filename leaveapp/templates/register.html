{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow p-4">

            <h3 class="mb-4 text-center">
                Employee Register
            </h3>

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                       name="username"
                       class="form-control mb-3"
                       placeholder="Username">

                <input type="email"
                       name="email"
                       class="form-control mb-3"
                       placeholder="Email">

                <input type="password"
                       name="password"
                       class="form-control mb-3"
                       placeholder="Password">

                <button class="btn btn-success w-100">
                    Register
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
